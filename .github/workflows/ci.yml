name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '.agents/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '.agents/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Guard: go.mod must not contain replace directives — they break `go install`.
  # See: https://github.com/steveyegge/gastown/issues/2230
  check-no-replace-directives:
    name: Reject go.mod replace directives
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check for replace directives in go.mod
        run: |
          if grep -qE '^replace\s' go.mod; then
            echo "ERROR: go.mod contains replace directives."
            echo ""
            echo "Replace directives break 'go install github.com/jonbaldie/gastown/cmd/gt@main'."
            echo "See: https://github.com/steveyegge/gastown/issues/2230"
            echo ""
            echo "Found:"
            grep -n '^replace' go.mod
            echo ""
            echo "Remove replace directives before merging to main."
            exit 1
          fi
          echo "OK: no replace directives in go.mod"

  # Guard: gastown no longer supports issues.jsonl — Dolt server is the only backend.
  check-no-issues-jsonl:
    name: Reject issues.jsonl
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Reject issues.jsonl if present
        run: |
          if [ -f .beads/issues.jsonl ]; then
            echo "ERROR: .beads/issues.jsonl must not exist in the repository."
            echo ""
            echo "Gastown requires a Dolt server — issues.jsonl is no longer supported."
            echo ""
            echo "To fix, run:"
            echo "  git rm .beads/issues.jsonl"
            echo "  git commit --amend"
            echo "  git push --force"
            echo ""
            exit 1
          fi
          echo "OK: no issues.jsonl found"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ICU4C development headers
        run: sudo apt-get install -y libicu-dev

      - name: Configure Git
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@gastown.test"

      - name: Install Dolt
        run: |
          curl -L https://github.com/dolthub/dolt/releases/download/v2.0.7/install.sh | sudo bash

      - name: Set up beads (bd)
        uses: ./.github/actions/setup-bd

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Build
        run: CGO_ENABLED=0 go build -v ./cmd/gt

      - name: Test with Coverage
        run: |
          set -o pipefail
          gotestsum --format testname --junitfile junit.xml -- -race -short -timeout=10m -coverprofile=coverage.out ./... 2>&1 | tee test-output.txt

      - name: Test gt now five-second path
        run: |
          for attempt in 1 2 3; do
            CGO_ENABLED=0 go test -short -run '^TestNowStartsTownInFiveSeconds$' -count=1 ./internal/cmd && exit 0
            echo "gt now latency attempt $attempt failed; retrying" >&2
          done
          exit 1

      - name: Test Report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 .github/scripts/junit-report.py junit.xml "Unit Test Failures"

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6
        with:
          files: junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ICU4C development headers
        run: sudo apt-get install -y libicu-dev

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: v2.11.4
          args: --timeout=5m

  messgo:
    name: Production Go quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install messgo
        run: go install github.com/quality-gates/messgo/cmd/messgo@latest

      - name: Run messgo on production Go
        run: |
          messgo . github unusedcode,design,codesize \
            --ignore-tests \
            --exclude .claude

  mutago-changes:
    name: Detect mutation packages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      has_production_go: ${{ steps.changes.outputs.has_production_go }}
      matrix: ${{ steps.changes.outputs.matrix }}
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      # Check out the PR head rather than GitHub's synthetic merge commit so
      # mutago computes the PR's merge base against the target branch.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch PR base
        run: >-
          git fetch --no-tags origin
          "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Detect changed production Go code
        id: changes
        run: |
          merge_base="$(git merge-base "origin/${BASE_REF}" HEAD)"
          list="$RUNNER_TEMP/mutago-files.txt"
          # ACMR only: deleted files are gone and cannot be mutated.
          git diff --name-only --diff-filter=ACMR "$merge_base" HEAD -- \
            '*.go' ':(exclude)*_test.go' > "$list"
          if [ ! -s "$list" ]; then
            echo 'has_production_go=false' >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[{"package":"none","files":[]}]}' >> "$GITHUB_OUTPUT"
            echo 'No production Go code changed; skipping mutago.'
            exit 0
          fi

          matrix="$(jq -Rsc '
            def package:
              (split("/") | .[0:-1] | join("/")) |
              if . == "" then "." else . end;
            split("\n") |
            map(select(length > 0)) |
            sort_by(package) |
            group_by(package) |
            {include: [
              .[] as $files |
              range(0; $files | length; 20) as $start |
              {
                package: ($files[0] | package),
                batch: (($start / 20) + 1),
                files: $files[$start:$start + 20]
              }
            ]}
          ' "$list")"
          echo 'has_production_go=true' >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo 'Changed production Go files:'
          cat "$list"

  mutago-package:
    name: "Mutation package / ${{ matrix.package }} #${{ matrix.batch }}"
    needs: mutago-changes
    if: needs.mutago-changes.outputs.has_production_go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.mutago-changes.outputs.matrix) }}
    env:
      BASE_REF: ${{ github.base_ref }}
      MUTAGO_FILES: ${{ toJSON(matrix.files) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ICU4C development headers
        run: sudo apt-get install -y libicu-dev

      - name: Fetch PR base
        run: >-
          git fetch --no-tags origin
          "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Install mutago
        run: go install github.com/quality-gates/mutago/v2/cmd/mutago@v2.9.1

      - name: Run mutation tests
        run: |
          mapfile -t files < <(jq -r '.[]' <<< "$MUTAGO_FILES")
          set +e
          mutago \
            --coverage \
            --per-test \
            --workers 2 \
            --test-flags=-short \
            --git-diff-lines \
            --git-diff-base "origin/${BASE_REF}" \
            --timeout-coefficient 3 \
            --ignore-msi-with-no-mutations \
            --min-covered-msi 80 \
            --logger-github \
            --logger-summary-json \
            --quiet \
            --no-diffs \
            "${files[@]}"
          mutago_status=$?
          set -e

          if [ "$mutago_status" -eq 4 ]; then
            covered_mutants="$(jq '.totalMutantsCount - .notCoveredCount' mutago-summary.json)"
            if [ "$covered_mutants" -eq 0 ]; then
              echo 'No covered mutants in this batch; covered-MSI is not applicable.'
              exit 0
            fi
          fi
          exit "$mutago_status"

  mutago:
    name: Mutation Tests
    if: always() && github.event_name == 'pull_request'
    needs: [mutago-changes, mutago-package]
    runs-on: ubuntu-latest
    steps:
      - name: Verify mutation packages
        env:
          CHANGES_RESULT: ${{ needs.mutago-changes.result }}
          HAS_PRODUCTION_GO: ${{ needs.mutago-changes.outputs.has_production_go }}
          PACKAGE_RESULT: ${{ needs.mutago-package.result }}
        run: |
          if [ "$CHANGES_RESULT" != 'success' ]; then
            echo "Mutation change detection result: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [ "$HAS_PRODUCTION_GO" != 'true' ]; then
            echo 'No production Go code changed; mutation gate passes.'
            exit 0
          fi
          if [ "$PACKAGE_RESULT" != 'success' ]; then
            echo "Mutation package result: $PACKAGE_RESULT" >&2
            exit 1
          fi

  integration-shard:
    name: Integration Tests / ${{ matrix.name }}
    # Disabled pending the merge-base-aware mutago replacement tracked by gt-4imw.
    # Keep the complete jobs here so they remain available while the replacement
    # gate is calibrated.
    if: ${{ github.event_name == 'integration-tests-disabled' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The final range also catches non-letter test names.
          - name: A-F
            tags: integration
            run: '^Test[A-F]'
            junit: junit-integration-a-f.xml
          - name: G-Q
            tags: integration
            run: '^Test[G-Q]'
            junit: junit-integration-g-q.xml
          - name: R-Z
            tags: integration
            run: '^Test([^A-Q]|[R-Z])'
            junit: junit-integration-r-z.xml
          - name: Scheduler
            tags: 'integration scheduler_integration'
            run: '^(TestScheduler|TestScheduleBead_)'
            junit: junit-scheduler.xml
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ICU4C development headers
        run: sudo apt-get install -y libicu-dev

      - name: Configure Git
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@gastown.test"

      - name: Install Dolt
        run: |
          curl -L https://github.com/dolthub/dolt/releases/download/v2.0.7/install.sh | sudo bash

      - name: Pre-pull Dolt Docker image
        run: docker pull dolthub/dolt-sql-server:2.0.7

      - name: Set up beads (bd)
        uses: ./.github/actions/setup-bd

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Build gt
        run: |
          make build
          cp gt "$(go env GOPATH)/bin/"

      - name: Integration Tests
        run: >-
          gotestsum --format testname --junitfile '${{ matrix.junit }}' --
          -tags='${{ matrix.tags }}' -timeout=15m
          -run '${{ matrix.run }}' ./internal/cmd

      - name: Test Report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          python3 .github/scripts/junit-report.py '${{ matrix.junit }}'
          'Integration Test Failures (${{ matrix.name }})'

  integration:
    name: Integration Tests
    # Disabled with the shard job above; retain the aggregate check definition.
    if: ${{ github.event_name == 'integration-tests-disabled' }}
    needs: integration-shard
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all integration shards passed
        env:
          SHARD_RESULT: ${{ needs.integration-shard.result }}
        run: test "$SHARD_RESULT" = success

  go-install:
    name: Public go install
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26.5'

      - name: Install gt from the public module path
        env:
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tmpdir="$(mktemp -d)"
          mkdir -p "$tmpdir/bin" "$tmpdir/work"
          cd "$tmpdir/work"
          for attempt in 1 2 3; do
            if GOWORK=off CGO_ENABLED=0 GOBIN="$tmpdir/bin" \
              go install "github.com/jonbaldie/gastown/cmd/gt@$REF"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "public go install attempt $attempt failed; retrying"
            sleep 5
          done
          go version -m "$tmpdir/bin/gt" | grep 'github.com/jonbaldie/gastown/cmd/gt'
          go version -m "$tmpdir/bin/gt" | grep 'mod[[:space:]]\+github.com/jonbaldie/gastown[[:space:]]'
          "$tmpdir/bin/gt" version
